# TuringMonitor game telemetry profile for MangoHud.
# Installed by install.sh to /etc/TuringMonitor/turingmonitor.conf (not overwritten on updates).
#
# Usage — add to the Steam launch options of each game you want on the LCD:
#   MANGOHUD_CONFIGFILE=/etc/TuringMonitor/turingmonitor.conf mangohud %command%
#
# This profile is designed to be INVISIBLE on the game screen: the HUD never
# shows (no_display), it only writes one CSV line per second to the shared
# log folder that the TuringMonitor daemon tails.

# --- HUD: completely hidden ---
no_display

# --- CSV logging: one file per session, grows while the game runs ---
output_folder=/var/lib/turing-monitor/game
# seconds after init to start logging (0 would DISABLE it — falsy in MangoHud)
autostart_log=1
log_interval=1000
# no log_duration => runs as long as the game runs

# --- Keep the CSV lean: only what the LCD panel needs ---
fps
frametime
# engine/api columns so the CSV self-describes the graphics API when available
engine_version
arch