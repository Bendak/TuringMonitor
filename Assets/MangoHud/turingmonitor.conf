# TuringMonitor game telemetry profile for MangoHud.
# Installed by install.sh to BOTH:
#   /etc/TuringMonitor/turingmonitor.conf          (system, for non-sandboxed games)
#   $HOME/.config/MangoHud/turingmonitor.conf      (user — REQUIRED for Steam games:
#                                                   the pressure-vessel sandbox hides
#                                                   host /etc and /var from the game,
#                                                   $HOME is the only shared path)
#
# Usage — Steam launch options of each game you want on the LCD:
#   MANGOHUD_CONFIGFILE=$HOME/.config/MangoHud/turingmonitor.conf mangohud %command%
#
# IMPORTANT: do NOT use no_display — in MangoHud 0.8.4 it also kills the CSV
# autostart (the autostart_log check runs on the HUD update path). Instead the
# HUD is rendered fully transparent: invisible to the player, but alive.

# --- HUD: fully transparent (alpha 0) ---
alpha=0.0
background_alpha=0.0

# --- CSV logging: one file per session, grows while the game runs ---
# ~/ expands via wordexp inside the game's sandbox (HOME is shared)
output_folder=~/.local/share/TuringMonitor/game
# seconds after init to start logging (0 would DISABLE it — falsy in MangoHud)
autostart_log=1
log_interval=1000
# no log_duration => runs as long as the game runs

# --- Metrics for the CSV ---
fps
frametime